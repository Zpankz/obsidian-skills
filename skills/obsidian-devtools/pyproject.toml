[project]
name = "obsidian-devtools"
version = "0.1.0"
description = "MCP server for inspecting Obsidian via Chrome DevTools Protocol"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=0.1.0",
    "httpx>=0.24.0",
    "websockets>=11.0",
    "psutil>=5.9.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
obsidian-devtools = "obsidian_devtools.server:main"
obdev = "obsidian_devtools.cli:main"
